# bassbox WM8960 mixer profile (RaspiAudio ULTRA++ V3)
#
# Format:  <exact amixer control name> = <value>
# Applied by scripts/mixer.sh with `amixer -c wm8960soundcard cset name='<name>' <value>`.
# Control names/ranges come from sound/soc/codecs/wm8960.c (rpi-6.18.y).
#
# Wiring (RaspiAudio docs): onboard mics = LINPUT1/RINPUT1, mic jack = LINPUT2/RINPUT2,
# LINE IN jack = LINPUT3/RINPUT3. Bass is a mono plug -> LEFT only (right is grounded).
#
# Target signal path:
#   LINPUT3 -> left PGA (non-inverting) -> left boost stage -> left ADC -> I2S capture ch1
#   I2S playback -> DAC -> output mixers (PCM only) -> headphone out
# Everything else off. The direct LINPUT3->boost path is unused because Linux DAPM only
# powers the input stage (AINL) when a PGA input switch is on; the PGA path also has a
# higher input impedance, which suits passive bass pickups.

# ---- Input: PGA source selection (Linux "Boost Mixer" = PGA input switches, LINPATH reg)
Left Boost Mixer LINPUT1 Switch = off
Left Boost Mixer LINPUT2 Switch = off
Left Boost Mixer LINPUT3 Switch = on
Right Boost Mixer RINPUT1 Switch = off
Right Boost Mixer RINPUT2 Switch = off
Right Boost Mixer RINPUT3 Switch = off

# ---- Input: PGA -> boost stage (LMIC2B)
Left Input Mixer Boost Switch = on
Right Input Mixer Boost Switch = off

# ---- Input: direct-to-boost line gains: 0 = mute (scale -15 dB + 3 dB/step, 5 = 0 dB)
Left Input Boost Mixer LINPUT2 Volume = 0
Left Input Boost Mixer LINPUT3 Volume = 0
Right Input Boost Mixer RINPUT2 Volume = 0
Right Input Boost Mixer RINPUT3 Volume = 0

# ---- Input: PGA boost (0 = 0 dB, 1 = +13, 2 = +20, 3 = +29 dB)
Left Input Boost Mixer LINPUT1 Volume = 0
Right Input Boost Mixer RINPUT1 Volume = 0

# ---- Input: PGA gain, 0..63 = -17.25..+30 dB in 0.75 dB steps; 23 = 0 dB (conservative start)
# Capture Switch is the PGA un-mute (left on, right muted).
Capture Volume = 23,0
Capture Switch = on,off
Capture Volume ZC Switch = off,off

# ---- ADC digital gain: 0 = mute, 195 = 0 dB, 255 = +30 dB (0.5 dB steps)
ADC PCM Capture Volume = 195,0
ADC High Pass Filter Switch = on
# enums by index: 0 = "No Inversion"; 0 = "Left Data = Left ADC;  Right Data = Right ADC"
ADC Polarity = 0
ADC Data Output Select = 0

# ---- Codec dynamics OFF (they fight the amp model). Enums are given by index (0 = "Off").
# DAC Mono Mix 0 = "Stereo".
ALC Function = 0
Noise Gate Switch = off

# ---- Output mixers: PCM only. Analog bypasses OFF (no dry bass leaking into the output).
Left Output Mixer PCM Playback Switch = on
Right Output Mixer PCM Playback Switch = on
Left Output Mixer LINPUT3 Switch = off
Right Output Mixer RINPUT3 Switch = off
Left Output Mixer Boost Bypass Switch = off
Right Output Mixer Boost Bypass Switch = off
# bypass gains to minimum (0 = -21 dB) as a second line of defence
Left Output Mixer LINPUT3 Volume = 0
Right Output Mixer RINPUT3 Volume = 0
Left Output Mixer Boost Bypass Volume = 0
Right Output Mixer Boost Bypass Volume = 0
Mono Output Mixer Left Switch = off
Mono Output Mixer Right Switch = off

# ---- DAC: 0 dB digital, no tricks
Playback Volume = 255,255
PCM Playback -6dB Switch = off
DAC Polarity = 0
DAC Deemphasis Switch = off
DAC Mono Mix = 0
3D Switch = off

# ---- Headphones: 0..127 = -121..+6 dB, <48 = mute; 115 = -6 dB (moderate)
Headphone Playback Volume = 115,115
Headphone Playback ZC Switch = on,on

# ---- Speakers (onboard + screw-terminal class-D, SPK_L/R): MUTED. <48 = hardware mute.
Speaker Playback Volume = 0,0
Speaker Playback ZC Switch = off,off
Speaker DC Volume = 0
Speaker AC Volume = 0
