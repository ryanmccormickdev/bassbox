# bassbox panel jack sense (libgpiod v2). Read by bassbox-engine at start.
# Wiring as of 2026-10-06 (docs/hardware.md "Jack sense"). Internal pull-ups are always enabled.
# Never use GPIO2/3 (the HAT's I2C).
enabled = 1
chip = /dev/gpiochip0
# IN jack: GPIO5 (pin 29) reads 1 when a plug is in
input_line = 5
input_plugged_level = 1
# OUT jack: GPIO6 (pin 31) reads 1 when a plug is in (measured 2026-10-18 with a real amp cable; the 10-06 "0" was the loopback sleeve)
output_line = 6
output_plugged_level = 1
# a level must be stable this long before it counts
debounce_ms = 100
# fade the output to silence while the IN jack is empty (no hum/pops from an open input)
mute_on_unplug = 1
