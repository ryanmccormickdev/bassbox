# bassbox WM8960 mixer profile (RaspiAudio ULTRA++ V3)
#
# Format:  <exact amixer control name> = <value>
# Applied by scripts/mixer.sh with `amixer -c wm8960soundcard cset name='<name>' <value>`.
# Control names/ranges come from sound/soc/codecs/wm8960.c (rpi-6.18.y).
#
# Wiring (RaspiAudio docs): onboard mics = LINPUT1/RINPUT1, mic jack = LINPUT2/RINPUT2,
# LINE IN jack = LINPUT3/RINPUT3. Bass is a mono plug -> LEFT only (right is grounded).
#
# Signal path (changed 2026-10-06, see docs/audio-path.md):
#   LINPUT3 -> left input BOOST mixer directly (LIN3BOOST, 0 dB) -> left ADC -> I2S capture ch1
#   I2S playback -> DAC -> output mixers (PCM only) -> headphone out (0 dB)
# The input PGA is NOT used. Its non-inverting input (LINPUT3 via LMP3) only works with LINPUT1
# on the inverting input (LMN1, = onboard mic here); with LMN1 open the PGA has no reference and
# its output drifts to the rail at ~180 LSB/s. That was the "DC ramp to +full scale" bug.
#
# NOTE: the driver's "ADC High Pass Filter Switch" is R5 bit0 = ADCHPD, which DISABLES the filter
# when set. So "off" here means the HPF is ON (wanted: removes the ADC's own DC offset).
# ---- Input: PGA (Linux "Boost Mixer" = PGA input switches LMN1/LMP2/LMP3): all OFF, PGA unused.
# DAPM then leaves the PGA (R25 AINL) powered down; the boost mixer (R47 LMIC) is powered through
# the static LINPUT3 -> "Left Input Mixer" route whenever capture runs.
Left Boost Mixer LINPUT1 Switch = off
Left Boost Mixer LINPUT2 Switch = off
Left Boost Mixer LINPUT3 Switch = off
Right Boost Mixer RINPUT1 Switch = off
Right Boost Mixer RINPUT2 Switch = off
Right Boost Mixer RINPUT3 Switch = off

# ---- Input: PGA -> boost stage (LMIC2B): off
Left Input Mixer Boost Switch = off
Right Input Mixer Boost Switch = off

# ---- Input: direct-to-boost line gains. 0 = mute, 1..7 = -12..+6 dB in 3 dB steps (5 = 0 dB).
# LINPUT3 at 0 dB: ADC full scale ~1 Vrms (2.8 Vpp), so a passive bass (0.5-1 Vpp peaks) lands
# around -15..-9 dBFS peak, leaving >= 9 dB headroom. Raise to 6 (+3 dB) or 7 (+6 dB) for a
# weak pickup; fine trim is the engine's in_gain_db.
Left Input Boost Mixer LINPUT3 Volume = 5
Left Input Boost Mixer LINPUT2 Volume = 0
Right Input Boost Mixer RINPUT2 Volume = 0
Right Input Boost Mixer RINPUT3 Volume = 0

# ---- Input: PGA boost (0 = 0 dB, 1 = +13, 2 = +20, 3 = +29 dB): unused, 0
Left Input Boost Mixer LINPUT1 Volume = 0
Right Input Boost Mixer RINPUT1 Volume = 0

# ---- Input: PGA gain/mute: unused (PGA is powered down); keep it muted and at 0 dB (23).
Capture Volume = 23,23
Capture Switch = off,off
Capture Volume ZC Switch = off,off

# ---- ADC digital gain: 0 = mute, 195 = 0 dB, 255 = +30 dB (0.5 dB steps). Right ADC muted.
ADC PCM Capture Volume = 195,0
# "off" = ADCHPD 0 = high-pass filter ENABLED (see header note)
ADC High Pass Filter Switch = off
# enums by index: 0 = "No Inversion"; 0 = "Left Data = Left ADC;  Right Data = Right ADC"
ADC Polarity = 0
ADC Data Output Select = 0

# ---- Codec dynamics OFF (they fight the amp model). Enums are given by index (0 = "Off").
# DAC Mono Mix 0 = "Stereo".
ALC Function = 0
Noise Gate Switch = off

# ---- Output mixers: PCM only. Analog bypasses OFF (no dry bass leaking into the output).
Left Output Mixer PCM Playback Switch = on
Right Output Mixer PCM Playback Switch = on
Left Output Mixer LINPUT3 Switch = off
Right Output Mixer RINPUT3 Switch = off
Left Output Mixer Boost Bypass Switch = off
Right Output Mixer Boost Bypass Switch = off
# bypass gains to minimum (0 = -21 dB) as a second line of defence
Left Output Mixer LINPUT3 Volume = 0
Right Output Mixer RINPUT3 Volume = 0
Left Output Mixer Boost Bypass Volume = 0
Right Output Mixer Boost Bypass Volume = 0
Mono Output Mixer Left Switch = off
Mono Output Mixer Right Switch = off

# ---- DAC: 0 dB digital, no tricks
Playback Volume = 255,255
PCM Playback -6dB Switch = off
DAC Polarity = 0
DAC Deemphasis Switch = off
DAC Mono Mix = 0
3D Switch = off

# ---- Headphones (= panel OUT): 0..127 = -121..+6 dB, <48 = mute; 121 = 0 dB.
# 0 dB analog makes the pedal unity-gain end to end (ADC and DAC full scale are both ~1 Vrms);
# the engine's out_gain_db sets the level. Zero-cross OFF: with ZC on and the ZC timeout off
# (R23 TOEN=0) a volume write can stay pending until signal arrives.
Headphone Playback Volume = 121,121
Headphone Playback ZC Switch = off,off

# ---- Speakers (onboard + screw-terminal class-D, SPK_L/R): OFF and MUTED.
# "Speaker Switch" is a DAPM pin switch added by config/overlays/bassbox-wm8960.dts: off = DAPM
# never powers the class-D amp (when powered, it raises the ADC noise floor ~10 dB). '?' = optional
# (the control only exists once that overlay is loaded). Volume <48 = hardware mute as a backstop.
?Speaker Switch = off
Speaker Playback Volume = 0,0
Speaker Playback ZC Switch = off,off
Speaker DC Volume = 0
Speaker AC Volume = 0
