# bassbox-engine settings (key = value). Command-line flags override these.
# Read by /usr/local/bin/bassbox-engine --config /opt/bassbox/config/engine.conf (bassbox-engine.service).

device = hw:wm8960soundcard
rate = 48000
# ALSA period (frames) and number of periods. Nominal I/O latency = period * periods frames
# (+ codec filters). 64x3 chosen by the soak (docs/realtime.md): with 2
# periods the I2S DMA fetches ~32 frames ahead of the DAC, leaving only period-32 frames of slack.
period = 64
periods = 3
# auto = S32_LE (24-bit ADC data), falling back to S16_LE. Capture and playback always match.
format = auto

# audio thread: SCHED_FIFO priority, pinned to the isolated CPU (cmdline isolcpus=3)
cpu = 3
priority = 80
# control thread (socket, presets, GPIO, tuner) stays off the audio core
control_cpus = 0-2

socket = /run/bassbox/engine.sock
state_dir = /var/lib/bassbox
factory_dir = /opt/bassbox/presets/factory
jacks_conf = /opt/bassbox/config/jacks.conf
# output muted this long after start (ADC high-pass settling), then a 20 ms fade-in
startup_mute = 0.5
